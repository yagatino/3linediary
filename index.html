<!-- Firebase SDK 모듈 로드 및 Script 시작 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, doc, setDoc, getDoc, deleteDoc, query, where, orderBy, limit, getDocs, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase 설정 정보
    const firebaseConfig = {
      apiKey: "AIzaSyCgV2xPOvxOYgamK_PnpCdSbQ3eL1iGe-c",
      authDomain: "line-diary-cca6a.firebaseapp.com",
      projectId: "line-diary-cca6a",
      storageBucket: "line-diary-cca6a.firebasestorage.app",
      messagingSenderId: "355499285781",
      appId: "1:355499285781:web:3f89a6d8dd7a4cb2b09d1c",
      measurementId: "G-4TBSFY1BJK"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let currentPenName = "";
    let currentImageBlob = null;
    let diariesMap = new Map();

    // 달력 및 모드 변수
    let calendarDate = new Date();
    let writtenDatesSet = new Set();
    let selectedDateKey = null;
    let targetDeleteDocId = null;
    let isRandomMode = false;

    // 모바일 리다이렉트 로그인 결과 처리
    getRedirectResult(auth).catch(e => {
      console.log("리다이렉트 처리 결과:", e);
    });

    // 로그인 상태 감지
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('app-section').classList.remove('hidden');
        document.getElementById('calendar-section').classList.remove('hidden');
        document.getElementById('list-section').classList.remove('hidden');
        
        await loadUserProfile();
        loadAllDiaryDates();
        loadDiaries();
      } else {
        currentUser = null;
        document.getElementById('login-section').classList.remove('hidden');
        document.getElementById('app-section').classList.add('hidden');
        document.getElementById('calendar-section').classList.add('hidden');
        document.getElementById('list-section').classList.add('hidden');
      }
    });

    // 구글 로그인 (아이폰/모바일 환경 리다이렉트 자동 대응)
    window.loginWithGoogle = () => {
      const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      if (isMobile) {
        signInWithRedirect(auth, provider).catch(e => {
          if (e.code !== 'auth/cancelled-popup-request') {
            alert("로그인 실패: " + e.message);
          }
        });
      } else {
        signInWithPopup(auth, provider).catch(e => {
          if (e.code !== 'auth/cancelled-popup-request') {
            alert("로그인 실패: " + e.message);
          }
        });
      }
    };

    // 로그아웃
    window.logout = () => signOut(auth);

    // 필명 불러오기
    async function loadUserProfile() {
      try {
        const userDocRef = doc(db, "users", currentUser.uid);
        const userDoc = await getDoc(userDocRef);
        if (userDoc.exists() && userDoc.data().penName) {
          currentPenName = userDoc.data().penName;
        } else {
          currentPenName = currentUser.displayName || "익명 작가";
        }
      } catch (e) {
        currentPenName = currentUser.displayName || "익명 작가";
      }
      document.getElementById('user-info').innerText = `${currentPenName} 님`;
      document.getElementById('penname-input').value = currentPenName;
    }

    // 필명 유효성 검사
    function validatePenName(name) {
      const koreanRegex = /[ㄱ-ㅎ|ㅏ-ㅣ|가-힣]/;
      return koreanRegex.test(name) ? name.length <= 10 : name.length <= 15;
    }

    // 필명 저장
    window.savePenName = async () => {
      const newName = document.getElementById('penname-input').value.trim();
      if (!newName) {
        alert("필명을 입력해주세요.");
        return;
      }

      if (!validatePenName(newName)) {
        alert("글자 수 제한을 초과했습니다.\n(한글 포함 시 최대 10자 / 영문·숫자 최대 15자)");
        return;
      }

      try {
        await setDoc(doc(db, "users", currentUser.uid), {
          penName: newName,
          updatedAt: serverTimestamp()
        }, { merge: true });

        currentPenName = newName;
        document.getElementById('user-info').innerText = `${currentPenName} 님`;
        togglePenNameModal();
        alert("필명이 변경되었습니다.");
        loadDiaries();
      } catch (e) {
        alert("필명 저장 중 오류가 발생했습니다.");
      }
    };

    window.togglePenNameModal = () => {
      document.getElementById('penname-box').classList.toggle('hidden');
    };

    // 한글 -> 영어 자동 번역
    async function translateText(text) {
      if (!text.trim()) return "";
      try {
        const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=ko|en`);
        const data = await response.json();
        return data.responseData.translatedText;
      } catch (e) {
        return "번역 오류가 발생했습니다.";
      }
    }

    // [1단계] 번역 실행 처리 함수
    window.handleTranslate = async () => {
      const koreanText = document.getElementById('korean-input').value.trim();
      const translateBtn = document.getElementById('translate-btn');

      if (!koreanText) {
        alert("한글 일기 내용을 입력해주세요.");
        return;
      }

      translateBtn.disabled = true;
      translateBtn.innerText = "번역 진행 중...";

      try {
        const translated = await translateText(koreanText);
        document.getElementById('english-input').value = translated;

        document.getElementById('step2-box').classList.remove('hidden');
        document.getElementById('step3-box').classList.remove('hidden');
      } catch (e) {
        alert("번역 처리 중 오류가 발생했습니다.");
      } finally {
        translateBtn.disabled = false;
        translateBtn.innerText = "1단계 완료: 번역하기";
      }
    };

    // 3단계 파일 선택 시 저장 버튼 제어 및 미리보기
    window.handleFileChange = (event) => {
      const file = event.target.files[0];
      const submitBtn = document.getElementById('submit-btn');
      const previewContainer = document.getElementById('preview-container');
      const previewImg = document.getElementById('photo-preview');

      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          previewImg.src = e.target.result;
          previewContainer.classList.remove('hidden');
          submitBtn.classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      } else {
        previewContainer.classList.add('hidden');
        submitBtn.classList.add('hidden');
      }
    };

    // 이미지 리사이징
    function resizeAndConvertBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            const max_size = 800;

            if (width > height) {
              if (width > max_size) {
                height *= max_size / width;
                width = max_size;
              }
            } else {
              if (height > max_size) {
                width *= max_size / height;
                height = max_size;
              }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
            resolve(dataUrl);
          };
          img.onerror = (err) => reject(err);
        };
        reader.onerror = (err) => reject(err);
      });
    }

    // [3단계] 최종 일기 저장
    window.saveDiary = async () => {
      const koreanText = document.getElementById('korean-input').value.trim();
      const translatedText = document.getElementById('english-input').value.trim();
      const photoFile = document.getElementById('photo-input').files[0];
      const submitBtn = document.getElementById('submit-btn');

      if (!koreanText) {
        alert("한글 일기 내용을 입력해주세요.");
        return;
      }

      if (!photoFile) {
        alert("필사 사진을 첨부해 주세요.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = "저장 중...";

      try {
        let photoDataUrl = await resizeAndConvertBase64(photoFile);

        const now = new Date();
        const dateString = now.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });

        await addDoc(collection(db, "diaries"), {
          uid: currentUser.uid,
          penName: currentPenName,
          koreanContent: koreanText,
          translatedContent: translatedText,
          photoUrl: photoDataUrl,
          createdAt: serverTimestamp(),
          dateString: dateString
        });

        // 입력 폼 초기화
        document.getElementById('korean-input').value = "";
        document.getElementById('english-input').value = "";
        document.getElementById('photo-input').value = "";
        document.getElementById('preview-container').classList.add('hidden');
        document.getElementById('step2-box').classList.add('hidden');
        document.getElementById('step3-box').classList.add('hidden');
        submitBtn.classList.add('hidden');

        alert("일기가 성공적으로 저장되었습니다!");

      } catch (error) {
        console.error("저장 오류:", error);
        alert("저장 중 오류가 발생했습니다: " + error.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "일기 저장하기 👏";
      }
    };

    // 작성 날짜 파악
    function loadAllDiaryDates() {
      const q = query(
        collection(db, "diaries"),
        where("uid", "==", currentUser.uid)
      );

      onSnapshot(q, (snapshot) => {
        writtenDatesSet.clear();
        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          if (data.createdAt && data.createdAt.toDate) {
            const d = data.createdAt.toDate();
            writtenDatesSet.add(`${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`);
          } else if (data.dateString) {
            const match = data.dateString.match(/(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일/);
            if (match) {
              writtenDatesSet.add(`${parseInt(match[1])}-${parseInt(match[2])}-${parseInt(match[3])}`);
            }
          }
        });
        renderCalendar();
      });
    }

    // 달력 렌더링
    function renderCalendar() {
      const grid = document.getElementById('calendar-grid');
      const title = document.getElementById('calendar-month-title');
      grid.innerHTML = "";

      const year = calendarDate.getFullYear();
      const month = calendarDate.getMonth();

      title.innerText = `${year}년 ${month + 1}월`;

      const days = ['일', '월', '화', '수', '목', '금', '토'];
      days.forEach(d => {
        const h = document.createElement('div');
        h.className = 'calendar-day-header';
        h.innerText = d;
        grid.appendChild(h);
      });

      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'calendar-day-cell';
        grid.appendChild(emptyCell);
      }

      for (let date = 1; date <= lastDate; date++) {
        const cell = document.createElement('div');
        cell.className = 'calendar-day-cell';
        
        const dateKey = `${year}-${month + 1}-${date}`;
        cell.innerHTML = `<span>${date}</span>`;

        if (writtenDatesSet.has(dateKey)) {
          cell.classList.add('has-diary');
          const dot = document.createElement('div');
          dot.className = 'diary-dot';
          cell.appendChild(dot);

          cell.onclick = () => {
            selectedDateKey = dateKey;
            renderCalendar();
            loadDiariesByDate(year, month + 1, date);
          };
        }

        if (selectedDateKey === dateKey) {
          cell.classList.add('selected');
        }

        grid.appendChild(cell);
      }
    }

    // 특정 날짜의 일기 불러오기
    function loadDiariesByDate(year, month, day) {
      const q = query(
        collection(db, "diaries"),
        where("uid", "==", currentUser.uid),
        orderBy("createdAt", "desc")
      );

      onSnapshot(q, (snapshot) => {
        const listContainer = document.getElementById('diary-list');
        const listTitle = document.getElementById('list-title');
        const resetBtn = document.getElementById('reset-list-btn');

        listContainer.innerHTML = "";
        diariesMap.clear();

        listTitle.innerText = `${year}년 ${month}월 ${day}일 일기`;
        resetBtn.classList.remove('hidden');

        let matchCount = 0;

        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          let isMatch = false;

          if (data.createdAt && data.createdAt.toDate) {
            const d = data.createdAt.toDate();
            if (d.getFullYear() === year && (d.getMonth() + 1) === month && d.getDate() === day) {
              isMatch = true;
            }
          } else if (data.dateString) {
            const match = data.dateString.match(/(\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일/);
            if (match && parseInt(match[1]) === year && parseInt(match[2]) === month && parseInt(match[3]) === day) {
              isMatch = true;
            }
          }

          if (isMatch) {
            matchCount++;
            const docId = docSnap.id;
            diariesMap.set(docId, data);

            renderDiaryCard(listContainer, docId, data);
          }
        });

        if (matchCount === 0) {
          listContainer.innerHTML = "<p>해당 날짜에 작성된 일기가 없습니다.</p>";
        }

        document.getElementById('list-section').scrollIntoView({ behavior: 'smooth' });
      });
    }

    // 모드 토글 함수 (최근 <-> 랜덤)
    window.toggleDiaryMode = (toggleInput) => {
      isRandomMode = toggleInput.checked;
      const labelRecent = document.getElementById('label-recent');
      const labelRandom = document.getElementById('label-random');
      const refreshBtn = document.getElementById('refresh-random-btn');
      const listTitle = document.getElementById('list-title');

      if (isRandomMode) {
        labelRecent.classList.remove('active');
        labelRandom.classList.add('active');
        refreshBtn.classList.remove('hidden');
        listTitle.innerText = "랜덤 일기 (1개)";
        loadRandomDiary();
      } else {
        labelRandom.classList.remove('active');
        labelRecent.classList.add('active');
        refreshBtn.classList.add('hidden');
        resetDiaryList();
      }
    };

    // 랜덤 일기 1개 가져오기
    window.loadRandomDiary = async () => {
      if (!currentUser) return;
      const listContainer = document.getElementById('diary-list');
      listContainer.innerHTML = "<p>랜덤 일기를 불러오는 중...</p>";

      try {
        const q = query(
          collection(db, "diaries"),
          where("uid", "==", currentUser.uid)
        );
        const snapshot = await getDocs(q);

        if (snapshot.empty) {
          listContainer.innerHTML = "<p>작성된 일기가 없습니다.</p>";
          return;
        }

        const docsArray = [];
        snapshot.forEach((docSnap) => {
          docsArray.push({ id: docSnap.id, data: docSnap.data() });
        });

        const randomIndex = Math.floor(Math.random() * docsArray.length);
        const selected = docsArray[randomIndex];

        listContainer.innerHTML = "";
        diariesMap.clear();
        diariesMap.set(selected.id, selected.data);

        renderDiaryCard(listContainer, selected.id, selected.data);

      } catch (error) {
        console.error("랜덤 일기 로드 오류:", error);
        listContainer.innerHTML = "<p>일기를 불러오는 도중 오류가 발생했습니다.</p>";
      }
    };

    // 일기 카드 HTML 생성 공통 함수
    function renderDiaryCard(container, docId, data) {
      const itemDiv = document.createElement('div');
      itemDiv.className = 'diary-item';
      itemDiv.id = `card-${docId}`;
      itemDiv.innerHTML = `
        <div class="timestamp">${data.dateString || ''}</div>
        <div class="author-tag">✍️ ${data.penName || currentPenName}</div>
        <p><strong>한글:</strong> ${data.koreanContent}</p>
        <p><strong>번역:</strong> ${data.translatedContent}</p>
        ${data.photoUrl ? `<img src="${data.photoUrl}" alt="필사 사진">` : ""}
        <div class="btn-group">
          <button onclick="downloadAsImage('${docId}')" class="secondary">이미지로 저장 및 공유</button>
          <button onclick="openDeleteModal('${docId}')" class="danger">지우기</button>
        </div>
      `;
      container.appendChild(itemDiv);
    }

    // 기본 목록(최신 3개) 되돌리기
    window.resetDiaryList = () => {
      selectedDateKey = null;
      document.getElementById('reset-list-btn').classList.add('hidden');
      document.getElementById('list-title').innerText = "최근 작성한 일기 (최신 3개)";
      renderCalendar();
      loadDiaries();
    };

    // 오늘 날짜 이동
    window.goToday = () => {
      const now = new Date();
      calendarDate = new Date(now.getFullYear(), now.getMonth(), 1);
      const todayKey = `${now.getFullYear()}-${now.getMonth() + 1}-${now.getDate()}`;
      
      selectedDateKey = todayKey;
      renderCalendar();

      if (writtenDatesSet.has(todayKey)) {
        loadDiariesByDate(now.getFullYear(), now.getMonth() + 1, now.getDate());
      } else {
        window.resetDiaryList();
      }
    };

    // 달력 월 이동
    window.changeMonth = (delta) => {
      calendarDate.setMonth(calendarDate.getMonth() + delta);
      renderCalendar();
    };

    // 기본 일기 목록 불러오기 (최신 3개)
    function loadDiaries() {
      const q = query(
        collection(db, "diaries"),
        where("uid", "==", currentUser.uid),
        orderBy("createdAt", "desc"),
        limit(3)
      );

      onSnapshot(q, (snapshot) => {
        if (selectedDateKey || isRandomMode) return;

        const listContainer = document.getElementById('diary-list');
        listContainer.innerHTML = "";
        diariesMap.clear();

        if (snapshot.empty) {
          listContainer.innerHTML = "<p>작성된 일기가 없습니다.</p>";
          return;
        }

        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const docId = docSnap.id;
          diariesMap.set(docId, data);
          renderDiaryCard(listContainer, docId, data);
        });
      });
    }

    // 일기 삭제 팝업 열기/닫기 처리
    window.openDeleteModal = (docId) => {
      targetDeleteDocId = docId;
      document.getElementById('delete-modal').classList.remove('hidden');
    };

    window.closeDeleteModal = () => {
      targetDeleteDocId = null;
      document.getElementById('delete-modal').classList.add('hidden');
    };

    // 일기 삭제 최종 실행 ("예" 버튼 클릭 시)
    document.getElementById('confirm-delete-btn').onclick = async () => {
      if (!targetDeleteDocId) return;

      try {
        await deleteDoc(doc(db, "diaries", targetDeleteDocId));
        alert("일기가 삭제되었습니다.");
        closeDeleteModal();
        if (isRandomMode) {
          loadRandomDiary();
        }
      } catch (error) {
        console.error("삭제 오류:", error);
        alert("삭제 중 오류가 발생했습니다: " + error.message);
      }
    };

    // 텍스트 줄바꿈 계산 (Canvas)
    function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
      const words = text.split('');
      let line = '';
      for(let n = 0; n < words.length; n++) {
        let testLine = line + words[n];
        let metrics = ctx.measureText(testLine);
        let testWidth = metrics.width;
        if (testWidth > maxWidth && n > 0) {
          ctx.fillText(line, x, y);
          line = words[n];
          y += lineHeight;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line, x, y);
      return y + lineHeight;
    }

    // Canvas 기반 카드 이미지 생성기
    window.downloadAsImage = async (docId) => {
      const data = diariesMap.get(docId);
      if (!data) return;

      const calcCanvas = document.createElement('canvas');
      const calcCtx = calcCanvas.getContext('2d');
      const width = 600;
      calcCtx.font = '16px -apple-system, sans-serif';

      let currentY = 110;

      const korText = data.koreanContent || '';
      const korLines = Math.ceil(calcCtx.measureText(korText).width / (width - 110)) || 1;
      currentY += (korLines * 26) + 15;

      const engText = data.translatedContent || '';
      const engLines = Math.ceil(calcCtx.measureText(engText).width / (width - 110)) || 1;
      currentY += (engLines * 26) + 20;

      let imgObj = null;
      let imgHeight = 0;
      if (data.photoUrl) {
        imgObj = new Image();
        imgObj.crossOrigin = "anonymous";
        imgObj.src = data.photoUrl;
        await new Promise((resolve) => {
          imgObj.onload = resolve;
          imgObj.onerror = resolve;
        });
        if (imgObj.width) {
          const imgWidth = width - 60;
          imgHeight = imgWidth * (imgObj.height / imgObj.width);
          currentY += imgHeight + 20;
        }
      }

      const finalHeight = currentY + 10;

      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = width;
      canvas.height = finalHeight;

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, width, finalHeight);

      ctx.strokeStyle = '#e5e5ea';
      ctx.lineWidth = 4;
      ctx.strokeRect(10, 10, width - 20, finalHeight - 20);

      ctx.fillStyle = '#8e8e93';
      ctx.font = '16px -apple-system, sans-serif';
      ctx.fillText(data.dateString || '', 30, 45);

      ctx.fillStyle = '#007aff';
      ctx.font = 'bold 18px -apple-system, sans-serif';
      ctx.fillText(`✍️ ${data.penName || currentPenName}`, 30, 75);

      let drawY = 110;

      ctx.fillStyle = '#000000';
      ctx.font = 'bold 16px -apple-system, sans-serif';
      ctx.fillText('한글:', 30, drawY);
      ctx.font = '16px -apple-system, sans-serif';
      drawY = wrapText(ctx, korText, 80, drawY, width - 110, 26) + 15;

      ctx.fillStyle = '#000000';
      ctx.font = 'bold 16px -apple-system, sans-serif';
      ctx.fillText('번역:', 30, drawY);
      ctx.font = '16px -apple-system, sans-serif';
      drawY = wrapText(ctx, engText, 80, drawY, width - 110, 26) + 20;

      if (imgObj && imgObj.width) {
        ctx.drawImage(imgObj, 30, drawY, width - 60, imgHeight);
      }

      const dataUrl = canvas.toDataURL('image/png');
      const modalImg = document.getElementById('modal-img');
      modalImg.src = dataUrl;

      await new Promise((resolve) => {
        canvas.toBlob(blob => {
          currentImageBlob = blob;
          resolve();
        });
      });

      document.getElementById('image-modal').classList.remove('hidden');
    };

    // 전역 모달 닫기 함수
    window.closeModal = () => {
      document.getElementById('image-modal').classList.add('hidden');
    };

    window.closeModalOnOverlay = (e) => {
      if (e.target.id === 'image-modal') {
        window.closeModal();
      }
    };

    // 전역 공유 함수
    window.shareImage = async () => {
      if (!currentImageBlob) {
        alert("이미지 생성 중입니다. 잠시 후 다시 시도해 주세요.");
        return;
      }
      
      const file = new File([currentImageBlob], 'diary.png', { type: 'image/png' });

      if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            files: [file],
            title: '나의 세 줄 일기',
            text: '오늘의 세 줄 일기 & 필사 카드입니다.'
          });
        } catch (e) {
          console.log('공유 취소/실패:', e);
        }
      } else {
        alert("이미지를 1초간 길게 눌러 [사진에 추가]를 선택하세요!");
      }
    };
  </script>
</body>
</html>
