<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>세 줄 일기 & 필사 노트</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 500px; margin: 0 auto; padding: 20px; background-color: #f9f9f9; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
    textarea, input[type="file"], input[type="text"] { width: 100%; margin-top: 8px; margin-bottom: 12px; box-sizing: border-box; }
    textarea { height: 100px; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 15px; }
    input[type="text"] { padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; }
    button { width: 100%; padding: 12px; background-color: #007aff; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; margin-bottom: 8px; }
    button.secondary { background-color: #34c759; }
    button.outline { background-color: transparent; color: #007aff; border: 1px solid #007aff; }
    button:disabled { background-color: #ccc; }
    .hidden { display: none; }
    .diary-item { border: 1px solid #e5e5ea; border-radius: 12px; padding: 16px; margin-bottom: 16px; background: #fff; }
    .diary-item img { max-width: 100%; border-radius: 8px; margin-top: 8px; }
    .timestamp { font-size: 12px; color: #8e8e93; margin-bottom: 4px; }
    .author-tag { font-size: 13px; font-weight: bold; color: #007aff; margin-bottom: 8px; }
    .notice-box { background-color: #fff8e6; border: 1px solid #ffe58f; border-radius: 8px; padding: 10px 12px; font-size: 12px; color: #8a6d3b; margin-bottom: 16px; line-height: 1.4; }
    .btn-group { margin-top: 12px; }
    .btn-group button { font-size: 13px; padding: 10px; margin-bottom: 0; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .user-nick { font-weight: bold; font-size: 15px; }
    footer { text-align: center; padding: 20px 0; font-size: 12px; color: #8e8e93; }
  </style>

  <!-- HTML을 이미지로 변환하는 라이브러리 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

  <!-- 1. 로그인 화면 -->
  <div id="login-section" class="card">
    <h2>세 줄 일기장</h2>
    <p>구글 계정으로 로그인하여 일기를 시작하세요.</p>
    <button onclick="loginWithGoogle()">Google 계정으로 로그인</button>
  </div>

  <!-- 2. 일기 작성 및 메인 화면 -->
  <div id="app-section" class="card hidden">
    <div class="header-bar">
      <div>
        <span id="user-info" class="user-nick"></span>
        <button onclick="togglePenNameModal()" class="outline" style="width:auto; padding:4px 8px; font-size:11px; margin-left:6px; margin-bottom:0;">필명 설정</button>
      </div>
      <button onclick="logout()" style="width:auto; padding:6px 12px; font-size:12px; background-color:#ff3b30; margin-bottom:0;">로그아웃</button>
    </div>

    <!-- 필명 변경 모달/폼 -->
    <div id="penname-box" class="hidden" style="background:#f0f0f7; padding:12px; border-radius:8px; margin-bottom:12px;">
      <label style="font-size:13px; font-weight:bold;">필명(닉네임) 변경</label>
      <input type="text" id="penname-input" placeholder="한글 포함 최대 10자 / 영문·숫자 최대 15자">
      <div style="display:flex; gap:8px;">
        <button onclick="savePenName()" class="secondary" style="padding:8px; font-size:13px;">저장</button>
        <button onclick="togglePenNameModal()" class="outline" style="padding:8px; font-size:13px;">취소</button>
      </div>
    </div>

    <h3>오늘의 일기 쓰기</h3>
    
    <!-- 개인정보 경고 문구 -->
    <div class="notice-box">
      ⚠️ <strong>안내:</strong> 자동 번역 기능은 외부 API를 사용하므로, 주민등록번호, 비밀번호, 주소 등 민감한 개인정보는 일기에 작성하지 않도록 주의해 주세요.
    </div>

    <label>한글 일기</label>
    <textarea id="korean-input" placeholder="오늘 있었던 일을 한글로 작성하세요..."></textarea>

    <label>필사 사진 첨부</label>
    <input type="file" id="photo-input" accept="image/*">

    <button id="submit-btn" onclick="saveDiary()">번역 및 저장하기</button>
  </div>

  <!-- 3. 일기 목록 화면 -->
  <div id="list-section" class="card hidden">
    <h3>저장된 일기 목록</h3>
    <div id="diary-list"></div>
  </div>

  <!-- 저작권 표시 -->
  <footer>
    © 2026 Park Seunghoon. All rights reserved.
  </footer>

  <!-- Firebase SDK 모듈 로드 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, doc, setDoc, getDoc, query, where, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase 설정 정보
    const firebaseConfig = {
      apiKey: "AIzaSyCgV2xPOvxOYgamK_PnpCdSbQ3eL1iGe-c",
      authDomain: "line-diary-cca6a.firebaseapp.com",
      projectId: "line-diary-cca6a",
      storageBucket: "line-diary-cca6a.firebasestorage.app",
      messagingSenderId: "355499285781",
      appId: "1:355499285781:web:3f89a6d8dd7a4cb2b09d1c",
      measurementId: "G-4TBSFY1BJK"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let currentPenName = "";

    // 로그인 상태 감지
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('app-section').classList.remove('hidden');
        document.getElementById('list-section').classList.remove('hidden');
        
        // 필명 불러오기 (설정 안했으면 구글 이름)
        await loadUserProfile();
        loadDiaries();
      } else {
        currentUser = null;
        document.getElementById('login-section').classList.remove('hidden');
        document.getElementById('app-section').classList.add('hidden');
        document.getElementById('list-section').classList.add('hidden');
      }
    });

    // 필명 불러오기
    async function loadUserProfile() {
      try {
        const userDocRef = doc(db, "users", currentUser.uid);
        const userDoc = await getDoc(userDocRef);
        if (userDoc.exists() && userDoc.data().penName) {
          currentPenName = userDoc.data().penName;
        } else {
          currentPenName = currentUser.displayName || "익명 작가";
        }
      } catch (e) {
        currentPenName = currentUser.displayName || "익명 작가";
      }
      document.getElementById('user-info').innerText = `${currentPenName} 님`;
      document.getElementById('penname-input').value = currentPenName;
    }

    // 필명 유효성 검사 (한글 포함 시 10자, 영문/숫자 15자)
    function validatePenName(name) {
      const koreanRegex = /[ㄱ-ㅎ|ㅏ-ㅣ|가-힣]/;
      const hasKorean = koreanRegex.test(name);

      if (hasKorean) {
        return name.length <= 10;
      } else {
        return name.length <= 15;
      }
    }

    // 필명 저장
    window.savePenName = async () => {
      const newName = document.getElementById('penname-input').value.trim();
      if (!newName) {
        alert("필명을 입력해주세요.");
        return;
      }

      if (!validatePenName(newName)) {
        alert("글자 수 제한을 초과했습니다.\n(한글 포함 시 최대 10자 / 영문·숫자 최대 15자)");
        return;
      }

      try {
        await setDoc(doc(db, "users", currentUser.uid), {
          penName: newName,
          updatedAt: serverTimestamp()
        }, { merge: true });

        currentPenName = newName;
        document.getElementById('user-info').innerText = `${currentPenName} 님`;
        togglePenNameModal();
        alert("필명이 변경되었습니다.");
        loadDiaries(); // 기존 일기 목록 상단 표시 업데이트
      } catch (e) {
        alert("필명 저장 중 오류가 발생했습니다.");
      }
    };

    window.togglePenNameModal = () => {
      const box = document.getElementById('penname-box');
      box.classList.toggle('hidden');
    };

    // 구글 로그인 / 로그아웃
    window.loginWithGoogle = () => signInWithPopup(auth, provider).catch(e => alert("로그인 실패: " + e.message));
    window.logout = () => signOut(auth);

    // 한글 -> 영어 자동 번역 (MyMemory Free API)
    async function translateText(text) {
      if (!text.trim()) return "";
      try {
        const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=ko|en`);
        const data = await response.json();
        return data.responseData.translatedText;
      } catch (e) {
        return "번역 오류가 발생했습니다.";
      }
    }

    // 이미지를 Base64 텍스트로 변환하는 함수 (Storage 대체)
    function convertBase64(file) {
      return new Promise((resolve, reject) => {
        const fileReader = new FileReader();
        fileReader.readAsDataURL(file);
        fileReader.onload = () => resolve(fileReader.result);
        fileReader.onerror = (error) => reject(error);
      });
    }

    // 일기 저장 (Storage 없이 DB에 직접 사진 데이터 저장)
    window.saveDiary = async () => {
      const koreanText = document.getElementById('korean-input').value;
      const photoFile = document.getElementById('photo-input').files[0];
      const submitBtn = document.getElementById('submit-btn');

      if (!koreanText.trim()) {
        alert("일기 내용을 입력해주세요.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = "저장 중...";

      try {
        const translatedText = await translateText(koreanText);
        let photoDataUrl = "";

        // 사진이 선택되었을 경우 Base64 변환
        if (photoFile) {
          photoDataUrl = await convertBase64(photoFile);
        }

        const now = new Date();
        const dateString = now.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });

        await addDoc(collection(db, "diaries"), {
          uid: currentUser.uid,
          penName: currentPenName,
          koreanContent: koreanText,
          translatedContent: translatedText,
          photoUrl: photoDataUrl, // Base64 인코딩 데이터 저장
          createdAt: serverTimestamp(),
          dateString: dateString
        });

        document.getElementById('korean-input').value = "";
        document.getElementById('photo-input').value = "";
        alert("일기가 성공적으로 저장되었습니다!");

      } catch (error) {
        console.error("저장 오류:", error);
        alert("저장 중 오류가 발생했습니다.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "번역 및 저장하기";
      }
    };

    // 일기 목록 불러오기
    function loadDiaries() {
      const q = query(
        collection(db, "diaries"),
        where("uid", "==", currentUser.uid),
        orderBy("createdAt", "desc")
      );

      onSnapshot(q, (snapshot) => {
        const listContainer = document.getElementById('diary-list');
        listContainer.innerHTML = "";

        if (snapshot.empty) {
          listContainer.innerHTML = "<p>작성된 일기가 없습니다.</p>";
          return;
        }

        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const docId = docSnap.id;

          const itemDiv = document.createElement('div');
          itemDiv.className = 'diary-item';
          itemDiv.id = `card-${docId}`;
          itemDiv.innerHTML = `
            <div class="timestamp">${data.dateString || ''}</div>
            <div class="author-tag">✍️ ${data.penName || currentPenName}</div>
            <p><strong>한글:</strong> ${data.koreanContent}</p>
            <p><strong>번역:</strong> ${data.translatedContent}</p>
            ${data.photoUrl ? `<img src="${data.photoUrl}" alt="필사 사진">` : ""}
            <div class="btn-group">
              <button onclick="downloadAsImage('card-${docId}')" class="secondary">이미지로 저장 및 공유</button>
            </div>
          `;
          listContainer.appendChild(itemDiv);
        });
      });
    }

    // 이미지 파일 저장 함수
    window.downloadAsImage = (cardId) => {
      const target = document.getElementById(cardId);
      const btnGroup = target.querySelector('.btn-group');
      
      if (btnGroup) btnGroup.style.display = 'none';

      html2canvas(target, { useCORS: true, scale: 2 }).then(canvas => {
        const link = document.createElement('a');
        link.download = `diary_${Date.now()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        
        if (btnGroup) btnGroup.style.display = 'block';
      });
    };
  </script>
</body>
</html>
